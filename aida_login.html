<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .primary-gradient-btn {
            background: linear-gradient(135deg, #00cffc 0%, #0058ba 100%);
        }
        .ambient-blob {
            filter: blur(80px);
            z-index: -1;
        }
    </style>

<body class="bg-surface font-body text-on-surface min-h-screen relative overflow-hidden flex flex-col">
<!-- Ambient Gradient Blobs -->
<div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] rounded-full bg-primary-container opacity-10 ambient-blob"></div>
<div class="absolute bottom-[5%] left-[-10%] w-[600px] h-[600px] rounded-full bg-secondary-container opacity-10 ambient-blob"></div>
<!-- Navigation (Suppressed per Shell Visibility Rule for Login) -->
<header class="fixed top-0 w-full z-50">
<div class="flex justify-between items-center px-8 py-6 w-full max-w-7xl mx-auto">
<div class="text-2xl font-bold tracking-tighter text-slate-900 dark:text-slate-100 font-headline">GetLanded</div>
<div class="hidden md:flex gap-8 items-center">
<a class="text-slate-500 hover:text-cyan-500 transition-colors duration-200 font-manrope text-sm font-medium tracking-tight" href="#">Product</a>
<a class="text-slate-500 hover:text-cyan-500 transition-colors duration-200 font-manrope text-sm font-medium tracking-tight" href="#">Pricing</a>
<a class="text-cyan-500 font-manrope text-sm font-medium tracking-tight" href="#">Sign up</a>
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-6 pt-20 pb-12">
<div class="w-full max-w-md">
<!-- Login Card -->
<div class="glass-card p-10 rounded-[2rem] shadow-[0_12px_40px_rgba(44,47,49,0.06)] border border-white/20">
<div class="mb-10 text-center">
<h1 class="text-4xl font-extrabold tracking-[-0.04em] text-on-surface mb-3 font-headline">Welcome back</h1>
<p class="text-on-surface-variant text-lg leading-relaxed">Please enter your details to sign in.</p>
</div>
<form class="space-y-6">
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant px-1 font-label">Email Address</label>
<input class="w-full px-6 py-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary-container/30 focus:bg-surface-container-lowest transition-all duration-200 outline-none text-on-surface placeholder:text-outline-variant" placeholder="name@company.com" type="email"/>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant font-label">Password</label>
<a class="text-xs font-bold uppercase tracking-widest text-secondary hover:text-primary transition-colors font-label" href="#">Forgot?</a>
</div>
<input class="w-full px-6 py-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary-container/30 focus:bg-surface-container-lowest transition-all duration-200 outline-none text-on-surface placeholder:text-outline-variant" placeholder="••••••••" type="password"/>
</div>
<div class="pt-4">
<button class="primary-gradient-btn w-full py-4 rounded-xl text-on-primary font-bold text-lg shadow-[0_12px_24px_rgba(0,100,123,0.15)] hover:saturate-150 active:scale-[0.98] transition-all duration-200" type="submit">
                            Sign In
                        </button>
</div>
</form>
<div class="mt-8 flex items-center gap-4">
<div class="h-px flex-grow bg-outline-variant/20"></div>
<span class="text-xs font-bold uppercase tracking-widest text-outline-variant font-label">or continue with</span>
<div class="h-px flex-grow bg-outline-variant/20"></div>
</div>
<div class="mt-8 grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 px-4 py-3 rounded-xl bg-surface-container-low hover:bg-surface-container-high transition-colors duration-200 text-on-surface-variant font-medium text-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="google">google</span>
                        Google
                    </button>
<button class="flex items-center justify-center gap-3 px-4 py-3 rounded-xl bg-surface-container-low hover:bg-surface-container-high transition-colors duration-200 text-on-surface-variant font-medium text-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="apple">ios</span>
                        Apple
                    </button>
</div>
</div>
<div class="mt-8 text-center">
<p class="text-on-surface-variant font-medium">
                    Don't have an account? 
                    <a class="text-secondary font-bold hover:underline underline-offset-4 ml-1" href="#">Sign up</a>
</p>
</div>
</div>
</main>
<!-- Footer (Universal for informational pages) -->
<footer class="w-full">
<div class="flex flex-col md:flex-row justify-between items-center px-8 py-10 w-full max-w-7xl mx-auto gap-6 md:gap-0">
<div class="text-lg font-bold text-slate-900 dark:text-slate-100 font-headline">GetLanded</div>
<div class="flex gap-8">
<a class="text-slate-400 hover:text-slate-900 transition-opacity font-manrope text-xs uppercase tracking-widest font-label" href="#">Privacy Policy</a>

<a class="text-slate-400 hover:text-slate-900 transition-opacity font-manrope text-xs uppercase tracking-widest font-label" href="#">Help Center</a>
</div>
<div class="text-slate-400 font-manrope text-xs uppercase tracking-widest font-label text-center md:text-right">
                © 2024 GetLanded. Built for the modern professional.
            </div>
</div>
</footer>
